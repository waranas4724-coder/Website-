<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · PromptForge</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap" style="padding:40px 0;max-width:1100px"><a href="/" class="muted">← Back</a><div id="login" style="max-width:420px;margin:70px auto"><span class="kicker">PRIVATE ADMIN</span><h1>Control Room</h1><input id="user" placeholder="Username" class="field"><input id="pass" type="password" placeholder="Password" class="field"><button id="loginBtn" class="copy">Sign in</button><p id="err" class="muted"></p></div><div id="panel" style="display:none"><div class="section-head"><div><span class="kicker">CONTROL ROOM</span><h1>PromptForge Admin</h1></div><button id="logout" class="pill">Logout</button></div>
<div class="card admin-card"><h3>⚙️ API Providers — unlimited</h3><p class="muted">Add as many APIs as you want. Lower priority number runs first; failed providers automatically fall back to the next enabled provider.</p><div class="two"><select id="pcat" class="field"><option value="prompt_generate">Prompt Generate</option><option value="photo_generate">Photo Generate</option><option value="trending_search">Trending Search</option></select><input id="pname" class="field" placeholder="Provider name"></div><div class="two"><input id="purl" class="field" placeholder="API endpoint URL"><input id="pkey" class="field" placeholder="API key"></div><div class="two"><select id="pmethod" class="field"><option>GET</option><option>POST</option></select><input id="priority" class="field" type="number" value="100" placeholder="Priority"></div><input id="model" class="field" placeholder="Model (optional)"><textarea id="headers" class="field" rows="2" placeholder='Headers JSON, e.g. {"x-api-key":"{{api_key}}"}'>{}</textarea><textarea id="body" class="field" rows="4" placeholder='POST body template JSON, e.g. {"prompt":"{{topic}}"}'></textarea><input id="paths" class="field" placeholder='Response paths JSON, e.g. {"prompt":"choices.0.message.content"} or {"imageUrl":"data.url"} or {"topics":"items"}' value='{}'><input id="notes" class="field" placeholder="Notes"><button id="addProvider" class="copy">+ Add API provider</button><span id="pstatus" class="muted"></span><div id="providers" style="margin-top:15px"></div></div>
<div class="card admin-card"><h3>🤖 Automatic posting</h3><label><input id="auto" type="checkbox"> Enable automatic posting</label><div class="two"><input id="cron" class="field" value="*/30 * * * *" placeholder="Cron schedule"><input id="copySec" class="field" type="number" value="10" placeholder="Copy countdown seconds"></div><input id="direct" class="field" placeholder="Direct-link URL opened before copy"><button id="saveSettings" class="pill">Save settings</button> <button id="runNow" class="pill">Run now</button></div>
<div class="card admin-card"><h3>📢 Ads</h3><div id="adsBox"></div><button id="saveAds" class="copy">Save ads</button></div>
<div class="card admin-card"><h3>✍️ Manual prompt</h3><input id="title" class="field" placeholder="Title"><textarea id="prompt" class="field" rows="6" placeholder="Prompt"></textarea><div class="two"><input id="model2" class="field" placeholder="Model"><input id="category" class="field" placeholder="Category"></div><button id="publish" class="copy">Publish</button><span id="status" class="muted"></span></div><h2>Published prompts</h2><div id="list"></div></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function me(){let x=await(await fetch('/api/admin/me')).json();if(x.authenticated)show();}
function show(){$('login').style.display='none';$('panel').style.display='block';load();loadProviders();loadSettings();loadAds()}
$('loginBtn').onclick=async()=>{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});if(r.ok)show();else $('err').textContent='Invalid credentials'};$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload()};
$('addProvider').onclick=async()=>{let b={name:$('pname').value,category:$('pcat').value,base_url:$('purl').value,api_key:$('pkey').value,method:$('pmethod').value,priority:+$('priority').value||100,model:$('model').value,notes:$('notes').value,body_template:$('body').value,headers:JSON.parse($('headers').value||'{}'),response_paths:JSON.parse($('paths').value||'{}')};let r=await fetch('/api/admin/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});$('pstatus').textContent=r.ok?' Added ✓':' Check JSON/settings';if(r.ok){$('pkey').value='';loadProviders()}};
async function loadProviders(){let a=await (await fetch('/api/admin/providers')).json();$('providers').innerHTML=a.map(p=>`<div class="provider"><b>${esc(p.name)}</b> · <span>${esc(p.category)}</span> · priority ${p.priority} ${p.enabled?'':'· disabled'}<button class="pill" style="float:right" onclick="delProvider(${p.id})">Delete</button><br><small class="muted">${esc(p.base_url)}</small></div>`).join('')||'<p class="muted">No providers yet.</p>'}async function delProvider(id){await fetch('/api/admin/providers/'+id,{method:'DELETE'});loadProviders()}
async function loadSettings(){let x=await(await fetch('/api/admin/settings')).json();$('auto').checked=!!x.autoPostEnabled;$('cron').value=x.cron||'*/30 * * * *';$('copySec').value=x.copyGateSeconds??10;$('direct').value=x.directLink||''} $('saveSettings').onclick=async()=>{await fetch('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({autoPostEnabled:$('auto').checked,cron:$('cron').value,copyGateSeconds:+$('copySec').value,directLink:$('direct').value})});alert('Settings saved')};$('runNow').onclick=async()=>{let x=await(await fetch('/api/admin/collect',{method:'POST'})).json();alert(JSON.stringify(x));load()};
const S=['head_code','popunder','social_bar','banner_top','banner_middle','banner_bottom','modal_banner','native_banner'];async function loadAds(){let a=await(await fetch('/api/admin/ads')).json();$('adsBox').innerHTML=S.map(k=>{let x=a.find(v=>v.slot===k)||{};return `<div style="border-top:1px solid #29292f;padding:10px 0"><label><input type="checkbox" id="on_${k}" ${x.enabled?'checked':''}> ${k}</label><textarea id="code_${k}" class="field" rows="3" placeholder="Ad code">${esc(x.code||'')}</textarea><input id="h_${k}" class="field" type="number" value="${x.height||0}" placeholder="Height px"></div>`}).join('')};$('saveAds').onclick=async()=>{let b={};S.forEach(k=>b[k]={enabled:$('on_'+k).checked,code:$('code_'+k).value,height:+$('h_'+k).value||0});await fetch('/api/admin/ads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});alert('Ads saved')};
$('publish').onclick=async()=>{let r=await fetch('/api/admin/prompts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value,prompt:$('prompt').value,model:$('model2').value,category:$('category').value})});$('status').textContent=r.ok?' Published ✓':' Failed';if(r.ok)load()};async function load(){let a=await(await fetch('/api/admin/prompts')).json();$('list').innerHTML=a.slice(0,100).map(p=>`<div class="card" style="padding:12px;margin:7px 0;display:flex;justify-content:space-between"><span><b>${esc(p.title)}</b><br><small class="muted">${esc(p.category)} · ${p.auto?'AUTO':'MANUAL'}</small></span><button class="pill" onclick="del('${p.id}')">Delete</button></div>`).join('')||'<p class="muted">No prompts.</p>'}async function del(id){await fetch('/api/admin/prompts/'+id,{method:'DELETE'});load()}me();
</script><style>.field{display:block;width:100%;box-sizing:border-box;padding:12px;margin:7px 0;background:#101014;border:1px solid #303036;color:#fff;border-radius:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.admin-card{padding:20px;margin:16px 0}.provider{padding:12px;border-top:1px solid #29292f}@media(max-width:650px){.two{grid-template-columns:1fr}}</style></body></html>
